name: Khalil LinkedIn Story Run

on:
  schedule:
    - cron: "0 8 * * *"
    # Second daily run (8 PM Manila) so the 11 PM story slot is filled the same night,
    # after the 7 PM dated post has published and freed a queue slot.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, don't create posts)"
        type: boolean
        default: false

jobs:
  schedule-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch story posts
        run: |
          for i in 1 2 3 4; do curl -fsSL -o story-365-part$i.json https://raw.githubusercontent.com/workwithsahara/laya-meta-buffer-scheduler/main/story-365-part$i.json; done

      - name: Run scheduler
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_MIN_DATE: ${{ secrets.BUFFER_MIN_DATE }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          ROOT_FOLDER_ID: ${{ secrets.ROOT_FOLDER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node schedule-khaliljerro-posts.js
